<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO 优化 -->
    <meta name="description" content="科技-智能多功能响应式导航。提供高效的搜索、云端自定义网址管理、动态天气与专属壁纸等个性化功能。">
    <meta name="keywords" content="网址导航, 科技共享, 开发者导航, 智能导航, 响应式网站, 云端同步">
    
    <title id="page-title">M镇V界-智能导航</title>
    
    <!-- 性能优化：DNS 预解析与预连接 -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日间模式 (Light) 基础样式 */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, var(--card-alpha, 0.7));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        /* 夜间模式 (Dark) 基础样式 */
        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, var(--card-alpha, 0.45));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        /* 自定义壁纸激活状态的遮罩 */
        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* 全局过渡动画与拖拽交互支持 */
        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        /* 管理员权限控制类：默认非管理员隐藏编辑元素 */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }

        /* 主网格列数由云端布局配置控制（--grid-cols），响应式降级 */
        #main-nav-grid {
            grid-template-columns: repeat(var(--grid-cols, 3), minmax(0, 1fr));
        }
        @media (min-width: 640px) and (max-width: 1279px) {
            #main-nav-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 639px) {
            #main-nav-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 个性化设置浮窗 -->
    <div class="fixed top-5 right-5 z-[150] relative">
        <button aria-label="个性化设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer" title="个性化设置">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute right-0 top-full mt-2 w-72 bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160] max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="text-[11px] font-bold text-slate-400 px-1 mb-1.5" data-i18n="langTitle">语言 / Language</div>
            <div class="flex gap-2 mb-3 border-b border-slate-800 pb-3">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>

            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="themeTitle">基础色彩模式 (本地偏好)</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> <span data-i18n="themeLight">日间</span></button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> <span data-i18n="themeDark">夜间</span></button>
            </div>
            
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="bgTitle">自定义背景 (全站同步)</label>
                    <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden" data-i18n="clearBg">清除壁纸</button>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="custom-bg-input" data-i18n-placeholder="bgInputPlace" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                </div>
            </div>
            
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="text-[11px] text-slate-400 font-bold" data-i18n="pwdHint">修改密码：请到 Cloudflare 控制台修改环境变量 ADMIN_KEY</div>
            </div>

            <!-- 布局设置 (管理员可见, 全站同步) -->
            <div class="admin-only border-t border-slate-800 pt-3 mt-1 space-y-2">
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] text-slate-400 font-bold" data-i18n="layoutTitle">布局设置 (全站同步)</span>
                    <button onclick="resetLayoutSettings()" class="text-[10px] text-slate-500 hover:text-slate-300 cursor-pointer" data-i18n="layoutReset">重置默认</button>
                </div>
                <div class="text-[10px] text-slate-500 px-1" data-i18n="layoutColumns">主网格列数</div>
                <div class="flex gap-1.5 px-1" id="layout-columns">
                    <button onclick="setLayoutCol(2)" data-val="2" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer">2 列</button>
                    <button onclick="setLayoutCol(3)" data-val="3" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer">3 列</button>
                    <button onclick="setLayoutCol(4)" data-val="4" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer">4 列</button>
                </div>
                <div class="text-[10px] text-slate-500 px-1" data-i18n="layoutGap">卡片间距</div>
                <div class="flex gap-1.5 px-1" id="layout-gap">
                    <button onclick="setLayoutGap(16)" data-val="16" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer" data-i18n="gapTight">紧凑</button>
                    <button onclick="setLayoutGap(32)" data-val="32" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer" data-i18n="gapMid">标准</button>
                    <button onclick="setLayoutGap(48)" data-val="48" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer" data-i18n="gapLoose">宽松</button>
                </div>
                <div class="text-[10px] text-slate-500 px-1" data-i18n="layoutRadius">卡片圆角</div>
                <div class="flex gap-1.5 px-1" id="layout-radius">
                    <button onclick="setLayoutRadius(8)" data-val="8" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer" data-i18n="radiusSmall">小</button>
                    <button onclick="setLayoutRadius(16)" data-val="16" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer" data-i18n="radiusMid">中</button>
                    <button onclick="setLayoutRadius(24)" data-val="24" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer" data-i18n="radiusLarge">大</button>
                </div>
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] text-slate-400" data-i18n="layoutOpacity">卡片透明度</span>
                    <span id="layout-opacity-val" class="text-[11px] text-slate-500">70%</span>
                </div>
                <input type="range" id="layout-opacity" min="20" max="100" step="5" value="70" oninput="onOpacitySlide(this.value)" class="w-full accent-indigo-500 px-1 cursor-pointer">
                <div class="flex justify-between items-center px-1 py-0.5">
                    <span class="text-[11px] text-slate-400" data-i18n="layoutFriend">显示快捷链接</span>
                    <button onclick="toggleFriendLinks()" id="layout-friend-btn" class="w-9 h-5 rounded-full bg-indigo-600 relative transition-colors cursor-pointer"><span id="layout-friend-dot" class="absolute top-0.5 right-0.5 w-4 h-4 bg-white rounded-full transition-all"></span></button>
                </div>
                <div class="flex justify-between items-center px-1 py-0.5">
                    <span class="text-[11px] text-slate-400" data-i18n="layoutFavicon">自动获取网址 Logo</span>
                    <button onclick="toggleFavicon()" id="layout-favicon-btn" class="w-9 h-5 rounded-full bg-indigo-600 relative transition-colors cursor-pointer"><span id="layout-favicon-dot" class="absolute top-0.5 right-0.5 w-4 h-4 bg-white rounded-full transition-all"></span></button>
                </div>
                <div class="text-[10px] text-slate-500 px-1" data-i18n="layoutOrder">卡片顺序与显隐 (↑↓ 移动 / 眼睛隐藏)</div>
                <div id="layout-card-list" class="space-y-1 max-h-36 overflow-y-auto pr-1"></div>
                <button onclick="saveLayoutSettings()" class="w-full py-1.5 rounded-lg bg-indigo-600 text-white text-[11px] text-center hover:bg-indigo-500 transition-colors cursor-pointer" data-i18n="layoutSave">保存布局设置</button>
            </div>

            <div class="admin-only border-t border-slate-800 pt-2 mt-2">
                <button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-[11px] text-center hover:bg-red-900/40 transition-colors cursor-pointer" data-i18n="logoutBtn">退出后台管理</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-12 lg:py-20 flex flex-col items-center">
        
        <!-- 时间与问候语组件 -->
        <div class="text-center mb-10 animate-fade-in">
            <h1 id="clock" class="text-5xl lg:text-7xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2">00:00:00</h1>
            <div class="flex items-center justify-center space-x-3 text-sm md:text-base font-medium tracking-wide opacity-90">
                <span id="greeting" class="text-indigo-400">正在筹备问候语...</span>
                <span class="opacity-30">|</span>
                <span id="weather-info" class="flex items-center gap-1.5 text-emerald-400">
                    <i class="fas fa-spinner fa-spin text-xs"></i> <span data-i18n="weatherLoading">正在定位测算天气...</span>
                </span>
            </div>
        </div>

        <!-- 搜索引擎组件 -->
        <div class="w-full max-w-2xl mb-16 relative z-[100]">
            <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" class="relative">
                <div class="flex items-center glass-input rounded-2xl border border-slate-700/40 shadow-2xl focus-within:border-indigo-500/80 transition-all duration-300">
                    <div class="relative pl-4">
                        <button type="button" aria-label="切换搜索引擎" id="engine-btn" onclick="toggleEngineMenu(event)" class="flex items-center space-x-2 text-slate-400 hover:text-indigo-400 transition-colors py-4 pr-2 cursor-pointer">
                            <i id="engine-icon" class="fab fa-google text-blue-400"></i>
                            <i class="fas fa-chevron-down text-xs opacity-50"></i>
                        </button>
                        <div id="engine-menu" class="absolute left-2 top-full mt-2 w-36 bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden backdrop-blur-md overflow-hidden z-[110]">
                            <button type="button" onclick="selectEngine('google')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-google text-blue-400"></i> <span data-i18n="enGoogle">谷歌 Google</span></button>
                            <button type="button" onclick="selectEngine('bing')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-microsoft text-teal-400"></i> <span data-i18n="enBing">必应 Bing</span></button>
                            <button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-paw text-red-400"></i> <span data-i18n="enBaidu">百度 Baidu</span></button>
                            <button type="button" onclick="selectEngine('github')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-github text-slate-400"></i> <span>GitHub</span></button>
                        </div>
                    </div>
                    <input type="text" id="search-input" name="q" data-i18n-placeholder="searchGoogle" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-4 px-3 focus:outline-none focus:ring-0 text-base">
                    <button type="submit" aria-label="搜索" class="mr-3 p-2.5 text-slate-400 hover:text-indigo-400 transition-colors">
                        <i class="fas fa-search text-lg"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- 导航卡片网格 -->
        <div id="main-nav-grid" class="w-full grid grid-cols-1 xl:grid-cols-3 gap-8 mb-8 relative z-10 items-start">
            
            <div id="card-recommend" class="glass-card rounded-2xl p-6 shadow-xl hover:border-indigo-500/30 transition-all duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-indigo-400 flex items-center"><i id="fixed-card-icon-recommend" class="fas fa-star mr-2.5"></i> <span id="fixed-card-title-recommend" data-i18n="cardRec">官网直达</span></h3>
                    <button type="button" onclick="openFixedEdit('card-recommend')" class="admin-only text-[10px] px-2 py-1 bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 rounded-md hover:bg-indigo-600/40 transition-colors cursor-pointer z-[50]"><i class="fas fa-pen"></i> <span data-i18n="fixedEditBtn">编辑</span></button>
                </div>
                <div id="fixed-links-recommend" class="grid grid-cols-2 gap-3"></div>
            </div>

            <div id="card-develop" class="glass-card rounded-2xl p-6 shadow-xl hover:border-purple-500/30 transition-all duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-purple-400 flex items-center"><i id="fixed-card-icon-develop" class="fas fa-code mr-2.5"></i> <span id="fixed-card-title-develop" data-i18n="cardDev">常用工具</span></h3>
                    <button type="button" onclick="openFixedEdit('card-develop')" class="admin-only text-[10px] px-2 py-1 bg-purple-600/20 text-purple-400 border border-purple-500/20 rounded-md hover:bg-purple-600/40 transition-colors cursor-pointer z-[50]"><i class="fas fa-pen"></i> <span data-i18n="fixedEditBtn">编辑</span></button>
                </div>
                <div id="fixed-links-develop" class="grid grid-cols-2 gap-3"></div>
            </div>

            <div id="card-custom" class="glass-card rounded-2xl p-6 shadow-xl hover:border-pink-500/30 transition-all duration-300 xl:col-span-1">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-pink-400 flex items-center"><i class="fas fa-folder-plus mr-2.5"></i> <span data-i18n="cardCustom">站长推荐</span></h3>
                    <button type="button" onclick="openLinkModal('custom')" class="admin-only text-xs px-2.5 py-1 bg-pink-600/20 text-pink-400 border border-pink-500/20 rounded-lg hover:bg-pink-600/40 transition-colors cursor-pointer z-[50]" data-i18n="addCloud">添加 (云端)</button>
                </div>
                <div id="custom-links-container"></div>
                <div id="expand-action-wrapper" class="mt-4 pt-2 border-t border-slate-500/10 text-center hidden">
                    <button onclick="toggleExpandCustomLinks()" id="expand-btn" class="text-xs font-semibold text-pink-400 hover:text-pink-300 transition-colors cursor-pointer inline-flex items-center gap-1">
                        <span data-i18n="expandMore">展开显示更多</span> <i class="fas fa-chevron-down text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- 添加动态分类按钮 (管理员可见) -->
            <div id="add-section-card" class="admin-only glass-card rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500/50 transition-all border-dashed border-2 border-slate-500/30 xl:col-span-1" onclick="addCustomSection()" style="min-height: 180px;">
                <i class="fas fa-plus text-3xl text-slate-400 mb-2"></i>
                <span class="text-sm font-medium text-slate-400 mt-1" data-i18n="addSectionBtn">添加自定义区域</span>
            </div>

        </div>

        <div id="friend-links-wrap" class="w-full relative z-10 mb-12">
            <div class="glass-card rounded-2xl p-6 shadow-xl hover:border-emerald-500/20 transition-all duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-semibold text-emerald-400 flex items-center"><i class="fas fa-handshake mr-2.5"></i> <span data-i18n="cardFriend">快捷链接</span></h3>
                    <button type="button" onclick="openLinkModal('friend')" class="admin-only text-xs px-2.5 py-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/20 rounded-lg hover:bg-emerald-600/40 transition-colors cursor-pointer z-[50]" data-i18n="addLocal">添加 (本地)</button>
                </div>
                <div id="friend-links-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3"></div>
            </div>
        </div>

        <footer id="admin-trigger" ondblclick="triggerAdminLogin()" class="text-slate-500 text-xs mt-4 cursor-pointer select-none tracking-wide hover:text-indigo-400/70 transition-colors" title="后台入口 (双击 / Double Click)">
            <span data-i18n="footerText">© 2026 M镇V界-智能生态导航 · Powered by Cloudflare</span> <span id="admin-badge" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold hidden" data-i18n="adminBadge">已登入</span>
        </footer>
    </div>

    <!-- 弹窗模态框 -->
    <div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[300]" onclick="closeModalOnBlank(event)">
        <div class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-slate-100" onclick="event.stopPropagation()">
            <h4 id="modal-title" class="text-md font-semibold text-slate-200 mb-4 flex items-center"><i class="fas fa-link mr-2 text-indigo-400"></i><span id="modal-title-text">添加网址</span></h4>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteName">网站名称</label>
                    <input type="text" id="site-name" data-i18n-placeholder="siteNamePlace" placeholder="例如：百度" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteUrl">网站网址 (URL)</label>
                    <input type="text" id="site-url" placeholder="www.baidu.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>

        // 云端链接的本地化名称字典（仅保留仍在使用中的链接）

            "https://it-toutiao.blogspot.com": { zh: "IT头条博客", en: "IT Toutiao Blog" }
        };

        function getLocalizedLinkName(originalName, url) {
            if (url && dynamicLinkDict[url]) return dynamicLinkDict[url][currentLang];
            return originalName;
        }
        function t(key) { return i18n[currentLang][key] || key; }
        function setLanguage(lang) {
            currentLang = lang; localStorage.setItem('nav_lang', lang); document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            applyLanguage(); updateClockAndGreeting(); renderWeather(); selectEngine(currentEngineKey); document.getElementById('theme-panel').classList.add('hidden');
        }
        function applyLanguage() {
            document.getElementById('page-title').textContent = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
            loadCustomLinks(); loadFriendLinks(); renderDynamicSections();
        }

        // --- 1. 管理员鉴权（服务端验证） ---
        function checkAdminSession() {
            // 清理旧版永久登录标记（一次性）
            localStorage.removeItem('nav_admin_auth');
            const isAdmin = isAdminMode();
            if (isAdmin) { document.body.classList.add('is-admin'); document.getElementById('admin-badge').classList.remove('hidden'); } 
            else { document.body.classList.remove('is-admin'); document.getElementById('admin-badge').classList.add('hidden'); }
        }
        
        async function triggerAdminLogin() {
            if (isAdminMode()) { alert(t('alreadyAdmin')); return; }
            const pwd = prompt(t('pwdPrompt'));
            if (pwd === null || pwd.trim() === '') return;
            
            // 服务端验证：用密码作为 x-admin-key 请求配置接口，200 = 通过
            try {
                const res = await fetch('/api/config', { headers: { 'x-admin-key': pwd } });
                if (res.ok) {
                    sessionStorage.setItem('nav_admin_key', pwd);
                    alert(t('pwdSuccess')); checkAdminSession();
                } else {
                    alert(t('pwdFail'));
                }
            } catch (e) {
                alert(t('netError'));
            }
        }
        
        function logoutAdmin() {
            sessionStorage.removeItem('nav_admin_key');
            alert(t('logoutMsg'));
            isCustomLinksExpanded = false; expandedDynamicSections = {}; checkAdminSession(); document.getElementById('theme-panel').classList.add('hidden');
        }

        // --- 2. 拖拽核心控制逻辑 ---
        function handleDragStart(e, type, secId, linkIdx = null) {
            e.stopPropagation(); 
            if (!isAdminMode()) { e.preventDefault(); return; }
            dragType = type; dragSecId = secId; dragLinkIdx = linkIdx;
            e.dataTransfer.effectAllowed = 'move';
            const target = e.currentTarget;
            setTimeout(() => target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.stopPropagation(); 
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.dynamic-section-card, .group').forEach(el => el.style.border = '');
        }

        function handleDragOver(e, type) { 
            e.preventDefault(); 
            e.stopPropagation(); 
            e.dataTransfer.dropEffect = 'move'; 
            return false; 
        }

        function handleDrop(e, type, targetSecId, targetLinkIdx = null) {
            e.stopPropagation(); 
            e.preventDefault();
            if (!isAdminMode()) return;

            let secs = cloudConfig.dynamicSections || [];

            if (dragType === 'section' && type === 'section') {
                if (dragSecId === targetSecId) return;
                const fromIdx = secs.findIndex(s => s.id === dragSecId);
                const toIdx = secs.findIndex(s => s.id === targetSecId);
                if(fromIdx > -1 && toIdx > -1) {
                    const [moved] = secs.splice(fromIdx, 1);
                    secs.splice(toIdx, 0, moved);
                }
            } 
            else if (dragType === 'link' && type === 'link') {
                if (dragSecId === targetSecId && dragLinkIdx === targetLinkIdx) return;
                const fromSec = secs.find(s => s.id === dragSecId);
                const toSec = secs.find(s => s.id === targetSecId);
                if (fromSec && toSec) {
                    let actualTargetIdx = targetLinkIdx;
                    const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                    toSec.links.splice(actualTargetIdx, 0, movedLink);
                }
            } 
            else if (dragType === 'link' && type === 'section') {
                 const fromSec = secs.find(s => s.id === dragSecId);
                 const toSec = secs.find(s => s.id === targetSecId);
                 if (fromSec && toSec) {
                     if (fromSec === toSec) return; 
                     const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                     toSec.links.push(movedLink);
                 }
            }
            saveDynamicSections(secs);
        }

        // --- 3. 云端调度器 ---
        async function initCloudData() {
            const savedTheme = localStorage.getItem('nav_theme_mode') || 'theme-dark';
            document.body.classList.remove('theme-light', 'theme-dark'); document.body.classList.add(savedTheme);
            const globalDefaultBg = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop"; 
            let savedBg = localStorage.getItem('nav_custom_wallpaper');
            try { cloudConfig.dynamicSections = JSON.parse(localStorage.getItem('nav_dynamic_sections') || '[]'); } catch (e) { cloudConfig.dynamicSections = []; }
            
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const resJson = await res.json();
                    // 新接口返回 { ok, data, authed }
                    const configData = (resJson && resJson.data) ? resJson.data : {};
                    if (configData.wallpaper !== undefined) {
                        if (configData.wallpaper === "") { savedBg = null; localStorage.removeItem('nav_custom_wallpaper'); document.body.classList.add('bg-cleared'); } 
                        else { savedBg = configData.wallpaper; localStorage.setItem('nav_custom_wallpaper', savedBg); document.body.classList.remove('bg-cleared'); }
                    }
                    if (configData.dynamicSections) { cloudConfig.dynamicSections = configData.dynamicSections; localStorage.setItem('nav_dynamic_sections', JSON.stringify(cloudConfig.dynamicSections)); }
                    if (configData.layout && typeof configData.layout === 'object') { cloudConfig.layout = Object.assign(defaultLayout(), configData.layout); }
                    if (Array.isArray(configData.fixedSections) && configData.fixedSections.length) { cloudConfig.fixedSections = configData.fixedSections; }
                }
            } catch (e) {}

            if (!savedBg && !document.body.classList.contains('bg-cleared')) savedBg = globalDefaultBg; 
            if (savedBg) { applyWallpaperStyles(savedBg); document.getElementById('custom-bg-input').value = savedBg; document.getElementById('clear-bg-btn').classList.remove('hidden'); }
            applyLayout();
            renderDynamicSections();
            renderFixedSections();
        }

        async function updateCloudConfig(key, value) {
            cloudConfig[key] = value;
            try {
                const res = await fetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'x-admin-key': getAdminKey() },
                    body: JSON.stringify(cloudConfig)
                });
                if (res.status === 401) alert(t('needLogin'));
            } catch (e) { }
        }

                    { name: 'TP钱包官网', url: 'https://tokenpocket.pro' },

                    { name: 'outlook邮箱', url: 'https://outlook.com' },
                    { name: '新人第一课', url: 'https://mp.weixin.qq.com/s/3OvEYhBM0VcUKaThHgr-Vw' },
                    { name: 'VBOOST项目简介', url: 'https://weixin.qq.com/sph/AQf4RuKlsN' }
