        ];

        function getFixedSections() {
            if (Array.isArray(cloudConfig.fixedSections) && cloudConfig.fixedSections.length) return cloudConfig.fixedSections;
            return DEFAULT_FIXED_SECTIONS;
        }
        function getFixedSection(cardId) {
            return getFixedSections().find(s => s.id === cardId) || null;
        }

        function renderFixedSections() {
            getFixedSections().forEach(sec => {
                const isRec = sec.id === 'card-recommend';
                const suffix = isRec ? 'recommend' : 'develop';
                const linksEl = document.getElementById('fixed-links-' + suffix);
                if (!linksEl) return;
                const titleEl = document.getElementById('fixed-card-title-' + suffix);
                const iconEl = document.getElementById('fixed-card-icon-' + suffix);
                const links = Array.isArray(sec.links) ? sec.links : [];
                linksEl.innerHTML = '';
                // 云端已保存且该卡有自定义标题 → 用云端标题；否则走 i18n 默认翻译
                if (Array.isArray(cloudConfig.fixedSections) && cloudConfig.fixedSections.length && sec.title) {
                    titleEl.textContent = sec.title;
                    titleEl.removeAttribute('data-i18n');
                } else {
                    const key = isRec ? 'cardRec' : 'cardDev';
                    titleEl.setAttribute('data-i18n', key);
                    titleEl.textContent = t(key);
                }
                if (sec.icon) iconEl.className = 'fas ' + sec.icon + ' mr-2.5';
                linksEl.className = links.length > 6 ? 'grid grid-cols-3 gap-2' : 'grid grid-cols-2 gap-3';
                if (!links.length) {
                    const empty = document.createElement('div');
                    empty.className = 'col-span-full text-center text-xs text-slate-400/60 py-4';
                    empty.textContent = t('fixedEmpty');
                    linksEl.appendChild(empty);
                    return;
                }
                links.forEach(link => {
                    const wrap = document.createElement('div');
                    wrap.className = 'group relative flex items-center p-3 bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-indigo-600/10 transition-all';
                    const a = document.createElement('a');
                    a.href = link.url || '#'; a.target = '_blank'; a.rel = 'noopener noreferrer';
                    a.className = 'flex items-center w-full overflow-hidden';
                    const iconWrap = makeIconEl(link.name, link.url, 'w-5 h-5 text-[10px]', 'w-5 h-5');
                    iconWrap.className += ' mr-2.5 shrink-0';
                    const span = document.createElement('span');
                    span.className = 'text-sm font-medium truncate';
                    span.textContent = link.name || '';
                    a.append(iconWrap, span);
                    wrap.appendChild(a);
                    linksEl.appendChild(wrap);
                });
            });
        }

        let fixedEditCardId = null;
        function openFixedEdit(cardId) {
            fixedEditCardId = cardId;
            // 物化：编辑时把默认数据复制进云端配置，避免污染 DEFAULT 常量
            if (!Array.isArray(cloudConfig.fixedSections) || !cloudConfig.fixedSections.length) {
                cloudConfig.fixedSections = JSON.parse(JSON.stringify(DEFAULT_FIXED_SECTIONS));
            }
            const sec = getFixedSection(cardId);
            document.getElementById('fixed-edit-card-title').value = (sec && sec.title) ? sec.title : '';
            document.getElementById('fixed-edit-new-name').value = '';
            document.getElementById('fixed-edit-new-url').value = '';
            renderFixedEditList();
            document.getElementById('fixed-edit-modal').classList.remove('hidden');
        }
        function renderFixedEditList() {
            const sec = getFixedSection(fixedEditCardId);
            const links = (sec && Array.isArray(sec.links)) ? sec.links : [];
            const listEl = document.getElementById('fixed-edit-links-list');
            const countEl = document.getElementById('fixed-edit-count');
            countEl.textContent = links.length + ' ' + t('fixedCountUnit');
            listEl.innerHTML = '';
            if (!links.length) {
                const empty = document.createElement('div');
                empty.className = 'text-center text-xs text-slate-500 py-3 border border-dashed border-slate-700 rounded-xl';
                empty.textContent = t('fixedEmpty');
                listEl.appendChild(empty);
                return;
            }
            links.forEach((link, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 p-2 bg-slate-800/60 border border-slate-700 rounded-xl';
                const nameEl = document.createElement('span');
                nameEl.className = 'text-sm font-medium text-slate-200 truncate w-28 shrink-0';
                nameEl.textContent = link.name || '';
                const urlEl = document.createElement('span');
                urlEl.className = 'text-xs text-slate-500 truncate flex-1';
                urlEl.textContent = link.url || '';
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'text-red-400 hover:text-red-300 text-sm shrink-0 px-1.5 cursor-pointer transition-colors';
                delBtn.innerHTML = '<i class="fas fa-trash"></i>';
                delBtn.onclick = () => deleteFixedEditLink(idx);
                row.append(nameEl, urlEl, delBtn);
                listEl.appendChild(row);
            });
        }
        function addFixedEditLink() {
            const name = document.getElementById('fixed-edit-new-name').value.trim();
            let url = document.getElementById('fixed-edit-new-url').value.trim();
            if (!name || !url) return alert(t('fixedNeedNameUrl'));
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            let sec = getFixedSection(fixedEditCardId);
            if (!sec) { sec = { id: fixedEditCardId, title: null, icon: null, links: [] }; cloudConfig.fixedSections.push(sec); }
            sec.links.push({ name, url });
            renderFixedEditList();
            document.getElementById('fixed-edit-new-name').value = '';
            document.getElementById('fixed-edit-new-url').value = '';
        }
        function deleteFixedEditLink(idx) {
            if (!confirm(t('fixedDelConfirm'))) return;
            const sec = getFixedSection(fixedEditCardId);
            if (sec) sec.links.splice(idx, 1);
            renderFixedEditList();
        }
        async function saveFixedEdit() {
            const title = document.getElementById('fixed-edit-card-title').value.trim();
            let sec = getFixedSection(fixedEditCardId);
            if (!sec) { sec = { id: fixedEditCardId, title: null, icon: null, links: [] }; cloudConfig.fixedSections.push(sec); }
            sec.title = title || null;
            // 云端只保留两张固定卡
            cloudConfig.fixedSections = cloudConfig.fixedSections.filter(s => s.id === 'card-recommend' || s.id === 'card-develop');
            await updateCloudConfig('fixedSections', cloudConfig.fixedSections);
            closeFixedEdit();
            renderFixedSections();
            alert(t('fixedEditSaved'));
        }
        function closeFixedEdit() { document.getElementById('fixed-edit-modal').classList.add('hidden'); }
        function closeFixedEditOnBlank(e) { if (e.target.id === 'fixed-edit-modal') closeFixedEdit(); }

        // --- 3.5 布局设置（全站同步） ---
        function getLayout() {
            if (!cloudConfig.layout) cloudConfig.layout = defaultLayout();
            return cloudConfig.layout;
        }

        // 应用布局：列数/间距/圆角/透明度/快捷链接显隐/图标模式/卡片顺序与显隐
        function applyLayout() {
            const layout = getLayout();
            // 透明度
            document.documentElement.style.setProperty('--card-alpha', String(layout.opacity));
            // 主网格列数
            document.documentElement.style.setProperty('--grid-cols', String(layout.columns));
            const grid = document.getElementById('main-nav-grid');
            if (grid) grid.style.gap = layout.gap + 'px';
            // 卡片圆角
            const radiusPx = layout.radius + 'px';
            document.querySelectorAll('.glass-card').forEach(c => { c.style.borderRadius = radiusPx; });
            // 快捷链接显隐
            const friendWrap = document.getElementById('friend-links-wrap');
            if (friendWrap) friendWrap.style.display = layout.showFriendLinks ? '' : 'none';
            // 图标模式
            currentUseFavicon = layout.useFavicon;
            // 卡片顺序与显隐
            reorderCards();
            applyCardVisibility();
            syncLayoutUI();
        }

        // 按 cardOrder 重排主网格内的卡片 DOM（appendChild 即移动）
        function reorderCards() {
            const grid = document.getElementById('main-nav-grid');
            if (!grid) return;
            const order = getLayout().cardOrder || [];
            if (!order.length) return;
            order.forEach(id => {
                const el = document.getElementById(id);
                if (el && el.parentNode === grid) grid.appendChild(el);
            });
            // 添加区域按钮固定在最末尾（不在排序范围内）
            const addBtn = document.getElementById('add-section-card');
            if (addBtn && addBtn.parentNode === grid) grid.appendChild(addBtn);
        }

        // 隐藏卡片应用
        function applyCardVisibility() {
            const hidden = getLayout().hiddenCards || [];
            ['card-recommend', 'card-develop', 'card-custom'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = hidden.includes(id) ? 'none' : '';
            });
            document.querySelectorAll('.dynamic-section-card').forEach(el => {
                el.style.display = hidden.includes(el.id) ? 'none' : '';
            });
        }

        // 同步管理 UI 控件状态（按钮高亮/滑条/开关/卡片列表）
        function syncLayoutUI() {
            const layout = getLayout();
            setBtnGroup('layout-columns', layout.columns);
            setBtnGroup('layout-gap', layout.gap);
            setBtnGroup('layout-radius', layout.radius);
            const slider = document.getElementById('layout-opacity');
            if (slider) {
                slider.value = Math.round(layout.opacity * 100);
                const valEl = document.getElementById('layout-opacity-val');
                if (valEl) valEl.textContent = Math.round(layout.opacity * 100) + '%';
            }
            setToggleBtn('layout-friend-btn', 'layout-friend-dot', layout.showFriendLinks);
            setToggleBtn('layout-favicon-btn', 'layout-favicon-dot', layout.useFavicon);
            buildCardOrderList();
        }

        function setBtnGroup(groupId, val) {
            const group = document.getElementById(groupId);
            if (!group) return;
            group.querySelectorAll('button').forEach(b => {
                const active = Number(b.dataset.val) === Number(val);
                b.className = active
                    ? 'flex-1 py-1.5 rounded-lg bg-indigo-600 text-white text-xs text-center cursor-pointer'
                    : 'flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs text-center hover:bg-slate-700 cursor-pointer';
            });
        }

        function setToggleBtn(btnId, dotId, on) {
            const btn = document.getElementById(btnId);
            const dot = document.getElementById(dotId);
            if (!btn || !dot) return;
            btn.className = 'w-9 h-5 rounded-full relative transition-colors cursor-pointer ' + (on ? 'bg-indigo-600' : 'bg-slate-600');
            dot.className = 'absolute top-0.5 w-4 h-4 bg-white rounded-full transition-all ' + (on ? 'right-0.5' : 'left-0.5');
        }

        // 卡片顺序与显隐管理列表
        function buildCardOrderList() {
            const list = document.getElementById('layout-card-list');
            if (!list) return;
            const layout = getLayout();
            list.innerHTML = '';
            const cards = [
                { id: 'card-recommend', name: t('cardRec') },
                { id: 'card-develop', name: t('cardDev') },
                { id: 'card-custom', name: t('cardCustom') }
            ];
            (cloudConfig.dynamicSections || []).forEach(s => cards.push({ id: 'section-' + s.id, name: s.title }));
            const order = layout.cardOrder || [];
            cards.sort((a, b) => {
                const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
                return (ia === -1 ? 9999 : ia) - (ib === -1 ? 9999 : ib);
            });
            cards.forEach((card) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-1 bg-slate-800/70 rounded-lg px-2 py-1';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'text-[11px] text-slate-300 truncate flex-1';
                nameSpan.textContent = card.name;
                nameSpan.title = card.name;
                const btns = document.createElement('div');
                btns.className = 'flex gap-1 shrink-0';
                const hidden = (layout.hiddenCards || []).includes(card.id);
                const mkBtn = (html, cls, fn) => {
                    const b = document.createElement('button');
                    b.innerHTML = html;
                    b.className = 'w-5 h-5 rounded bg-slate-700 text-slate-300 hover:bg-slate-600 cursor-pointer text-center leading-none';
                    if (cls) b.className += ' ' + cls;
                    b.addEventListener('click', fn);
                    return b;
                };
                btns.append(
                    mkBtn('<i class="fas fa-arrow-up text-[9px]"></i>', 'hover:text-indigo-300', () => moveCard(card.id, -1)),
                    mkBtn('<i class="fas fa-arrow-down text-[9px]"></i>', 'hover:text-indigo-300', () => moveCard(card.id, 1)),
                    mkBtn(hidden ? '<i class="fas fa-eye-slash text-[10px]"></i>' : '<i class="fas fa-eye text-[10px]"></i>', hidden ? 'text-red-400' : 'hover:text-emerald-300', () => toggleCardVisible(card.id))
                );
                row.append(nameSpan, btns);
                list.appendChild(row);
            });
        }

        function moveCard(id, dir) {
            const layout = getLayout();
            if (!Array.isArray(layout.cardOrder)) layout.cardOrder = [];
            const allIds = ['card-recommend', 'card-develop', 'card-custom']
                .concat((cloudConfig.dynamicSections || []).map(s => 'section-' + s.id));
            allIds.forEach(cid => { if (!layout.cardOrder.includes(cid)) layout.cardOrder.push(cid); });
            const idx = layout.cardOrder.indexOf(id);
            const to = idx + dir;
            if (idx < 0 || to < 0 || to >= layout.cardOrder.length) return;
            const [m] = layout.cardOrder.splice(idx, 1);
            layout.cardOrder.splice(to, 0, m);
            applyLayout();
        }

        function toggleCardVisible(id) {
            const layout = getLayout();
            if (!Array.isArray(layout.hiddenCards)) layout.hiddenCards = [];
            const i = layout.hiddenCards.indexOf(id);
            if (i > -1) layout.hiddenCards.splice(i, 1); else layout.hiddenCards.push(id);
            applyLayout();
        }

        function setLayoutCol(n) { getLayout().columns = n; applyLayout(); }
        function setLayoutGap(n) { getLayout().gap = n; applyLayout(); }
        function setLayoutRadius(n) { getLayout().radius = n; applyLayout(); }
        function onOpacitySlide(v) {
            getLayout().opacity = Number(v) / 100;
            document.documentElement.style.setProperty('--card-alpha', String(Number(v) / 100));
            const valEl = document.getElementById('layout-opacity-val');
            if (valEl) valEl.textContent = v + '%';
        }
        function toggleFriendLinks() { const l = getLayout(); l.showFriendLinks = !l.showFriendLinks; applyLayout(); }
        function toggleFavicon() {
            const l = getLayout(); l.useFavicon = !l.useFavicon;
            currentUseFavicon = l.useFavicon;
            setToggleBtn('layout-favicon-btn', 'layout-favicon-dot', l.useFavicon);
            loadCustomLinks(); renderDynamicSections();
        }
        async function saveLayoutSettings() {
            updateCloudConfig('layout', getLayout());
            alert(t('layoutSaved'));
        }
        function resetLayoutSettings() {
            if (!confirm(t('layoutResetConfirm'))) return;
            cloudConfig.layout = defaultLayout();
            currentUseFavicon = true;
            applyLayout();
            updateCloudConfig('layout', cloudConfig.layout);
            alert(t('layoutSaved'));
        }

        function toggleThemeMenu(e) { e.stopPropagation(); document.getElementById('theme-panel').classList.toggle('hidden'); }
        function setBaseTheme(themeName) { document.body.classList.remove('theme-light', 'theme-dark'); document.body.classList.add(themeName); localStorage.setItem('nav_theme_mode', themeName); document.getElementById('theme-panel').classList.add('hidden'); }
        function applyWallpaperStyles(url) {
            // 只接受 http/https，过滤 CSS 注入字符
            if (!/^https?:\/\//i.test(url)) return;
            url = url.replace(/['"\\\r\n]/g, '');
            document.body.style.backgroundImage = 'url("' + url + '")';
            document.body.style.backgroundPosition = 'center'; document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundRepeat = 'no-repeat'; document.body.style.backgroundAttachment = 'fixed';
            document.body.classList.add('has-custom-bg');
        }

        async function applyCustomBg() {
            const url = document.getElementById('custom-bg-input').value.trim();
            if (!url) return alert(t('validUrlMsg'));
            if (!/^https?:\/\//i.test(url)) return alert(t('validUrlMsg'));
            applyWallpaperStyles(url); localStorage.setItem('nav_custom_wallpaper', url); document.body.classList.remove('bg-cleared'); document.getElementById('clear-bg-btn').classList.remove('hidden'); document.getElementById('theme-panel').classList.add('hidden');
            updateCloudConfig('wallpaper', url);
        }

        async function clearCustomBg() {
            document.body.style.backgroundImage = ''; document.body.classList.remove('has-custom-bg'); localStorage.removeItem('nav_custom_wallpaper'); document.body.classList.add('bg-cleared'); document.getElementById('custom-bg-input').value = ''; document.getElementById('clear-bg-btn').classList.add('hidden'); document.getElementById('theme-panel').classList.add('hidden');
            updateCloudConfig('wallpaper', "");
        }

        // --- 4. 动态自定义区域管理 ---
        function saveDynamicSections(sections) {
            localStorage.setItem('nav_dynamic_sections', JSON.stringify(sections));
            updateCloudConfig('dynamicSections', sections);
            renderDynamicSections();
        }

        function addCustomSection() {
            const title = prompt(t('promptSectionName'));
            if (!title || title.trim() === '') return;
            let secs = cloudConfig.dynamicSections || [];
            secs.push({ id: Date.now().toString(), title: title.trim(), links: [] });
            saveDynamicSections(secs);
        }

        function renameCustomSection(id) {
            let secs = cloudConfig.dynamicSections || [];
            const sec = secs.find(s => s.id === id);
            if(!sec) return;
            const newTitle = prompt(t('renameSectionPrompt'), sec.title);
            if(!newTitle || newTitle.trim() === '' || newTitle === sec.title) return;
            sec.title = newTitle.trim();
            saveDynamicSections(secs);
        }

        function deleteCustomSection(id) {
            if(!confirm(t('delSectionConfirm'))) return;
            let secs = cloudConfig.dynamicSections || [];
            secs = secs.filter(s => s.id !== id);
            saveDynamicSections(secs);
        }

        function toggleDynamicSectionExpand(secId) {
            expandedDynamicSections[secId] = !expandedDynamicSections[secId];
            renderDynamicSections();
        }

        // 渲染动态分类（纯 DOM 构建，杜绝 XSS）
        function renderDynamicSections() {
            document.querySelectorAll('.dynamic-section-card').forEach(el => el.remove());
            const grid = document.getElementById('main-nav-grid');
            const addBtnCard = document.getElementById('add-section-card');
            let secs = cloudConfig.dynamicSections || [];

            secs.forEach((sec) => {
                const isExpanded = !!expandedDynamicSections[sec.id];
                const linkCount = (sec.links || []).length;
                const isCompact = linkCount > 6;
                let gridCols = isCompact ? 'grid-cols-3 gap-2' : 'grid-cols-2 gap-3';
                let visibleLinks = sec.links || [];
                let showExpandBtn = false;
                if (linkCount > 9) {
                    showExpandBtn = true;
                    if (!isExpanded) visibleLinks = visibleLinks.slice(0, 9);
                }

                const card = document.createElement('div');
                card.className = "dynamic-section-card glass-card rounded-2xl p-6 shadow-xl hover:border-indigo-500/30 transition-all duration-300 relative xl:col-span-1";
                card.id = 'section-' + sec.id;
                card.draggable = true;
                card.ondragstart = (e) => handleDragStart(e, 'section', sec.id);
                card.ondragend = handleDragEnd;
                card.ondragover = (e) => handleDragOver(e, 'section');
                card.ondrop = (e) => handleDrop(e, 'section', sec.id);

                // 头部
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-4';
                const titleWrap = document.createElement('h3');
                titleWrap.className = 'text-lg font-semibold text-indigo-400 flex items-center cursor-move';
                titleWrap.style.cursor = 'grab';
                titleWrap.title = t('dragHint');
                const gripIcon = document.createElement('i');
                gripIcon.className = 'fas fa-grip-vertical mr-2 text-slate-500 opacity-60 admin-only text-sm';
                const layerIcon = document.createElement('i');
                layerIcon.className = 'fas fa-layer-group mr-2.5';
                const titleSpan = document.createElement('span');
                titleSpan.textContent = sec.title || '';
                titleWrap.append(gripIcon, layerIcon, titleSpan);

                const btns = document.createElement('div');
                btns.className = 'flex gap-1.5 shrink-0 ml-2';
                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'admin-only text-[10px] px-2 py-1 bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 rounded-md hover:bg-indigo-600/40 transition-colors cursor-pointer z-[50]';
                addBtn.textContent = t('addCloud');
                addBtn.addEventListener('click', () => openLinkModal('section_' + sec.id));
                const renameBtn = document.createElement('button');
                renameBtn.type = 'button';
                renameBtn.className = 'admin-only text-[10px] px-2 py-1 bg-sky-600/20 text-sky-400 border border-sky-500/20 rounded-md hover:bg-sky-600/40 transition-colors cursor-pointer z-[50]';
                renameBtn.innerHTML = '<i class="fas fa-pen"></i>';
                renameBtn.addEventListener('click', () => renameCustomSection(sec.id));
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'admin-only text-[10px] px-2 py-1 bg-red-600/20 text-red-400 border border-red-500/20 rounded-md hover:bg-red-600/40 transition-colors cursor-pointer z-[50]';
                delBtn.innerHTML = '<i class="fas fa-trash"></i>';
                delBtn.addEventListener('click', () => deleteCustomSection(sec.id));
                btns.append(addBtn, renameBtn, delBtn);
                header.append(titleWrap, btns);

                // 链接区
                const linksGrid = document.createElement('div');
                linksGrid.className = 'grid ' + gridCols;
                linksGrid.style.minHeight = '40px';
                linksGrid.ondragover = (e) => handleDragOver(e, 'section');
                linksGrid.ondrop = (e) => handleDrop(e, 'section', sec.id);

                if (linkCount === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'col-span-full text-center text-xs text-slate-400/60 py-4';
                    empty.textContent = t('noCloudLinks');
                    linksGrid.appendChild(empty);
                } else {
                    visibleLinks.forEach((link, idx) => {
                        linksGrid.appendChild(buildDynamicLinkEl(link, idx, sec.id, isCompact));
                    });
                }

                card.append(header, linksGrid);

                if (showExpandBtn) {
                    const wrap = document.createElement('div');
                    wrap.className = 'mt-4 pt-2 border-t border-slate-500/10 text-center';
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors cursor-pointer inline-flex items-center gap-1';
                    btn.addEventListener('click', () => toggleDynamicSectionExpand(sec.id));
                    const span = document.createElement('span');
                    span.textContent = isExpanded ? t('collapseMore') : t('expandMore') + ' (' + (linkCount - 9) + ')';
                    const icon = document.createElement('i');
                    icon.className = isExpanded ? 'fas fa-chevron-up text-[10px]' : 'fas fa-chevron-down text-[10px]';
                    btn.append(span, icon);
                    wrap.appendChild(btn);
                    card.appendChild(wrap);
                }

                grid.insertBefore(card, addBtnCard);
            });
            checkAdminSession();
            applyLayout();
        }

        function buildDynamicLinkEl(link, idx, secId, isCompact) {
            const pClass = isCompact ? 'p-2' : 'p-3';
            const spaceXClass = isCompact ? 'space-x-1.5' : 'space-x-2.5';
            const iconSizeClass = isCompact ? 'w-4 h-4 text-[9px]' : 'w-5 h-5 text-[10px]';
            const imgSizeClass = isCompact ? 'w-4 h-4' : 'w-5 h-5';
            const textSizeClass = isCompact ? 'text-[11px]' : 'text-sm';
            const prClass = isCompact ? 'pr-4' : 'pr-5';
            const dragMrClass = isCompact ? 'mr-1.5' : 'mr-2.5';
            const btnClass = isCompact ? 'right-1 text-[10px] px-1 py-0.5' : 'right-2 text-xs p-1';

            const displayName = getLocalizedLinkName(link.name, link.url);

            const wrap = document.createElement('div');
            wrap.className = 'group relative flex items-center justify-between ' + pClass + ' bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-indigo-600/10 transition-all';
            wrap.draggable = true;
            wrap.ondragstart = (e) => handleDragStart(e, 'link', secId, idx);
            wrap.ondragend = handleDragEnd;
            wrap.ondragover = (e) => handleDragOver(e, 'link');
            wrap.ondrop = (e) => handleDrop(e, 'link', secId, idx);

            const left = document.createElement('div');
            left.className = 'flex items-center w-full overflow-hidden';
            const grip = document.createElement('i');
            grip.className = 'fas fa-grip-vertical text-slate-500 opacity-0 group-hover:opacity-50 transition-opacity ' + dragMrClass + ' cursor-move admin-only text-[10px] shrink-0';

            const a = document.createElement('a');
            a.href = link.url;
            a.draggable = false;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'flex items-center ' + spaceXClass + ' truncate w-full ' + prClass;
            a.appendChild(makeIconEl(displayName, link.url, iconSizeClass, imgSizeClass));
            const span = document.createElement('span');
            span.className = textSizeClass + ' font-medium truncate';
            span.textContent = displayName;
            a.appendChild(span);

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'admin-only absolute ' + btnClass + ' text-slate-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-500/20 rounded cursor-pointer shrink-0';
            delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            delBtn.addEventListener('click', (e) => deleteSectionLink(e, secId, idx));

            left.append(grip, a);
            wrap.append(left, delBtn);
            return wrap;
        }

        function makeIconEl(displayName, url, iconSizeClass, imgSizeClass) {
            const icon = document.createElement('div');
            icon.className = iconSizeClass + ' rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold shrink-0';
            icon.textContent = (displayName || '?').charAt(0).toUpperCase();
            try {
                if (currentUseFavicon && url) {
                    const img = document.createElement('img');
                    img.src = 'https://unavatar.io/duckduckgo/' + new URL(url).hostname;
                    img.draggable = false;
                    img.className = imgSizeClass + ' rounded object-contain shrink-0';
                    img.alt = '';
                    img.addEventListener('error', () => { img.style.display = 'none'; });
                    return img;
                }
            } catch (e) {}
            return icon;
        }

        function deleteSectionLink(e, secId, linkIdx) {
            e.preventDefault(); e.stopPropagation();
            let secs = cloudConfig.dynamicSections || [];
            const sec = secs.find(s => s.id === secId);
            if(sec) { sec.links.splice(linkIdx, 1); saveDynamicSections(secs); }
        }

        // --- 5. 智能时间预测系统 ---
        const sTermNames = ["小寒", "大寒", "立春", "雨水", "惊蛰", "春分", "清明", "谷雨", "立夏", "小满", "芒种", "夏至", "小暑", "大暑", "立秋", "处暑", "白露", "秋分", "寒露", "霜降", "立冬", "小雪", "大雪", "冬至"];
        const sTermInfo = [0, 21208, 42467, 63836, 85337, 107014, 128867, 150921, 173149, 195551, 218072, 240693, 263343, 285989, 308563, 331033, 353350, 375494, 397447, 419210, 440795, 462224, 483532, 504758];
        function getSolarTerm(y, m, d) { const baseDate = new Date(1900, 0, 6, 2, 5, 0); const termDate = new Date((31556925974.7 * (y - 1900) + sTermInfo[(m * 2)]) + baseDate.getTime()); if (termDate.getMonth() == m && termDate.getDate() == d) return sTermNames[m * 2]; const termDate2 = new Date((31556925974.7 * (y - 1900) + sTermInfo[(m * 2 + 1)]) + baseDate.getTime()); if (termDate2.getMonth() == m && termDate2.getDate() == d) return sTermNames[m * 2 + 1]; return null; }
        function updateClockAndGreeting() {
            const now = new Date(); const y = now.getFullYear(), m = now.getMonth(), d = now.getDate(), h = now.getHours();
            document.getElementById('clock').innerText = `${String(h).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            let greetStr = "";
            if (currentLang === 'zh') {
                const term = getSolarTerm(y, m, d); const md = `${String(m+1).padStart(2, '0')}${String(d).padStart(2, '0')}`;
                const fests = { "0101": "元旦快乐", "0308": "妇女节快乐", "0501": "五一劳动节", "0601": "儿童节快乐", "1001": "国庆节快乐", "1225": "圣诞节" }; const fest = fests[md] || null;
                if (fest) greetStr = `🎉 今天是 ${fest}，祝你开心！`; else if (term) greetStr = `🍃 今日节气 · 【${term}】，顺应四时，平安喜乐。`;
                else { if (h >= 0 && h < 5) greetStr = "🌙 夜深了，静谧的星空在守护你，早点休息哦"; else if (h >= 5 && h < 8) greetStr = "🌅 清晨的朝阳刚刚升起，新的一天充满希望"; else if (h >= 8 && h < 11.5) greetStr = "☀️ 早上好，专注当下，今天也要元气满满"; else if (h >= 11.5 && h < 13.5) greetStr = "🍲 中午好，记得按时吃饭，歇息一下双眼"; else if (h >= 13.5 && h < 17.5) greetStr = "☕ 下午好，来杯清茶或咖啡，继续保持高效"; else if (h >= 17.5 && h < 19.5) greetStr = "🌇 傍晚好，落日余晖很美，放下疲惫准备享受夜晚吧"; else greetStr = "✨ 晚上好，属于自己的惬意时光，好好犒劳一下自己"; }
            } else {
                if (h >= 0 && h < 5) greetStr = "🌙 Late night, the stars are watching over you. Sleep early."; else if (h >= 5 && h < 8) greetStr = "🌅 The morning sun is rising, a new day full of hope."; else if (h >= 8 && h < 11.5) greetStr = "☀️ Good morning! Stay focused and full of energy."; else if (h >= 11.5 && h < 13.5) greetStr = "🍲 Good noon! Remember to eat on time and rest your eyes."; else if (h >= 13.5 && h < 17.5) greetStr = "☕ Good afternoon! Grab a tea or coffee and keep it up."; else if (h >= 17.5 && h < 19.5) greetStr = "🌇 Good evening! The sunset is beautiful. Relax and enjoy."; else greetStr = "✨ Good night! Enjoy your cozy time and treat yourself well.";
            }
            document.getElementById('greeting').innerText = greetStr;
        }
        setInterval(updateClockAndGreeting, 1000);

        // --- 6. 多语言智能天气定位 ---
        let weatherState = { city: "Earth", temp: 26, code: 0, fetched: false };
        async function fetchWeather() {
            try { const ipRes = await fetch('https://ipapi.co/json/'); if(!ipRes.ok) throw new Error(); const ipData = await ipRes.json(); const { latitude, longitude, city } = ipData; if(!latitude || !longitude) throw new Error();
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`); const weatherData = await weatherRes.json();
                weatherState = { city: city || "Earth", temp: Math.round(weatherData.current_weather.temperature), code: weatherData.current_weather.weathercode, fetched: true };
            } catch (e) { weatherState.fetched = false; } renderWeather();
        }
        function renderWeather() {
            const el = document.getElementById('weather-info');
            el.innerHTML = '';
            if (!weatherState.fetched) {
                const i = document.createElement('i'); i.className = 'fas fa-cloud text-slate-400';
                const span = document.createElement('span'); span.textContent = t('weatherDefault');
                el.append(i, span); return;
            }
            let displayCity = weatherState.city;
            if (currentLang === 'zh') { const cityMap = { "Singapore": "新加坡", "Santa Clara": "圣克拉拉", "San Jose": "圣何塞", "Beijing": "北京", "Shanghai": "上海", "Shenzhen": "深圳", "Guangzhou": "广州", "Hangzhou": "杭州", "Chengdu": "成都", "Hong Kong": "香港" }; displayCity = cityMap[displayCity] || displayCity; displayCity = displayCity.replace(/Province|City/gi, "").trim(); }
            const code = weatherState.code; let icon = 'fa-cloud'; let descKey = 'weatherCloudy';
            if (code === 0) { icon = 'fa-sun text-amber-500'; descKey = 'weatherClear'; } else if ([1, 2, 3].includes(code)) { icon = 'fa-cloud-sun text-indigo-300'; descKey = 'weatherCloudy'; } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) { icon = 'fa-cloud-showers-heavy text-sky-400'; descKey = 'weatherRain'; } else if ([71, 73, 75, 77, 85, 86].includes(code)) { icon = 'fa-snowflake text-blue-200'; descKey = 'weatherSnow'; } else if ([95, 96, 99].includes(code)) { icon = 'fa-bolt text-yellow-500'; descKey = 'weatherThunder'; }
            const i = document.createElement('i'); i.className = 'fas ' + icon;
            const span = document.createElement('span');
            span.textContent = displayCity + ' · ' + t(descKey) + ' ' + weatherState.temp + '°C';
            el.append(i, span);
        }

        // --- 7. 搜索引擎配置 ---
        const engines = { google: { action: 'https://www.google.com/search', name: 'q', placeholderKey: 'searchGoogle', icon: 'fab fa-google text-blue-400' }, bing: { action: 'https://cn.bing.com/search', name: 'q', placeholderKey: 'searchBing', icon: 'fab fa-microsoft text-teal-400' }, baidu: { action: 'https://www.baidu.com/s', name: 'wd', placeholderKey: 'searchBaidu', icon: 'fas fa-paw text-red-400' }, github: { action: 'https://github.com/search', name: 'q', placeholderKey: 'searchGithub', icon: 'fab fa-github text-slate-400' } };
        function toggleEngineMenu(e) { e.stopPropagation(); document.getElementById('engine-menu').classList.toggle('hidden'); }
        function selectEngine(key) { currentEngineKey = key; const form = document.getElementById('search-form'); const input = document.getElementById('search-input'); const icon = document.getElementById('engine-icon'); form.action = engines[key].action; input.name = engines[key].name; input.setAttribute('data-i18n-placeholder', engines[key].placeholderKey); input.placeholder = t(engines[key].placeholderKey); icon.className = engines[key].icon; document.getElementById('engine-menu').classList.add('hidden'); }

        // --- 8. 云端站长推荐 / 快捷链接 ---
        function openLinkModal(target) { currentModalTarget = target; const textEl = document.getElementById('modal-title-text'); if(target === 'friend') textEl.textContent = t('modalAddFriend'); else if(target === 'custom') textEl.textContent = t('modalAddCloud'); else textEl.textContent = t('modalAddSection'); toggleModal(true); }
        function toggleModal(show) { const modal = document.getElementById('modal'); if (show) { document.getElementById('site-name').value = ''; document.getElementById('site-url').value = ''; modal.classList.remove('hidden'); } else { modal.classList.add('hidden'); } }
        function closeModalOnBlank(e) { if(e.target.id === 'modal') toggleModal(false); }

        async function saveActiveLink() {
            const name = document.getElementById('site-name').value.trim(); let url = document.getElementById('site-url').value.trim();
            if(!name || !url) return alert(t('fillBoth'));
            if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

            if (currentModalTarget.startsWith('section_')) {
                const secId = currentModalTarget.replace('section_', ''); let secs = cloudConfig.dynamicSections || []; const sec = secs.find(s => s.id === secId);
                if(sec) { sec.links.push({ name, url }); saveDynamicSections(secs); }
            } else if(currentModalTarget === 'friend') {
                let links = [];
                try { links = JSON.parse(localStorage.getItem('nav_friend_links') || '[]'); } catch (e) {}
                links.push({ name, url }); localStorage.setItem('nav_friend_links', JSON.stringify(links)); loadFriendLinks();
            } else {
                let links = [];
                try { const res = await fetch('/api/links'); if(res.ok) { const data = await res.json(); links = (data && Array.isArray(data.data)) ? data.data : []; } } catch (e) {}
                if (!links.length) { try { links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); } catch (err) {} }
                links.push({ name, url });
                try {
                    const res = await fetch('/api/links', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-key': getAdminKey() }, body: JSON.stringify(links) });
                    if (!res.ok) throw new Error('unauthorized');
                    localStorage.setItem('nav_custom_links', JSON.stringify(links)); loadCustomLinks();
                } catch (error) {
                    localStorage.setItem('nav_custom_links', JSON.stringify(links)); loadCustomLinks();
                    alert(t('needLogin'));
                }
            } toggleModal(false);
        }

        async function loadCustomLinks() {
            const container = document.getElementById('custom-links-container'); const actionWrapper = document.getElementById('expand-action-wrapper');
            container.innerHTML = '';
            const loading = document.createElement('div');
            loading.className = 'col-span-full text-center text-xs text-slate-400/60 py-10';
            loading.textContent = t('loadingCloud');
            container.appendChild(loading);

            let links = [];
            try {
                const res = await fetch('/api/links');
                if(res.ok) { const data = await res.json(); links = (data && Array.isArray(data.data)) ? data.data : []; }
                else throw new Error();
            } catch(e) {
                try { links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); } catch (err) { links = []; }
            }
            container.innerHTML = '';
            
            if(links.length === 0) { 
                const empty = document.createElement('div');
                empty.className = 'col-span-full text-center text-xs text-slate-400/60 py-10';
                empty.textContent = t('noCloudLinks');
                container.appendChild(empty);
                actionWrapper.classList.add('hidden'); 
                container.className = 'grid grid-cols-2 gap-3';
                return; 
            }

            const isCompact = links.length > 6;
            container.className = isCompact ? 'grid grid-cols-3 gap-2' : 'grid grid-cols-2 gap-3';

            let visibleLinks = links;
            let showExpandBtn = false;
            if (links.length > 9) { showExpandBtn = true; if (!isCustomLinksExpanded) visibleLinks = links.slice(0, 9); }

            visibleLinks.forEach((item, index) => {
                container.appendChild(buildCloudLinkEl(item, index, isCompact));
            });

            if (showExpandBtn) { 
                actionWrapper.classList.remove('hidden');
                const btn = document.getElementById('expand-btn');
                btn.innerHTML = '';
                const span = document.createElement('span');
                span.textContent = isCustomLinksExpanded ? t('collapseMore') : t('expandMore') + ' (' + (links.length - 9) + ')';
                const icon = document.createElement('i');
                icon.className = isCustomLinksExpanded ? 'fas fa-chevron-up text-[10px]' : 'fas fa-chevron-down text-[10px]';
                btn.append(span, icon);
            } else { actionWrapper.classList.add('hidden'); }
        }

        function buildCloudLinkEl(item, index, isCompact) {
            const pClass = isCompact ? 'p-2' : 'p-3';
            const spaceXClass = isCompact ? 'space-x-1.5' : 'space-x-2.5';
            const iconSizeClass = isCompact ? 'w-4 h-4 text-[9px]' : 'w-5 h-5 text-[10px]';
            const imgSizeClass = isCompact ? 'w-4 h-4' : 'w-5 h-5';
            const textSizeClass = isCompact ? 'text-[11px]' : 'text-sm';
            const prClass = isCompact ? 'pr-4' : 'pr-5';
            const btnClass = isCompact ? 'right-1 text-[10px] px-1 py-0.5' : 'right-2 text-xs p-1';

            const displayName = getLocalizedLinkName(item.name, item.url);
            const wrap = document.createElement('div');
            wrap.className = 'group relative flex items-center justify-between ' + pClass + ' bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-indigo-600/10 transition-all';
            const left = document.createElement('div');
            left.className = 'flex items-center w-full overflow-hidden';
            const a = document.createElement('a');
            a.href = item.url;
            a.draggable = false;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'flex items-center ' + spaceXClass + ' truncate w-full ' + prClass;
            a.appendChild(makeIconEl(displayName, item.url, iconSizeClass, imgSizeClass));
            const span = document.createElement('span');
            span.className = textSizeClass + ' font-medium truncate';
            span.textContent = displayName;
            a.appendChild(span);
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'admin-only absolute ' + btnClass + ' text-slate-400 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-500/20 rounded cursor-pointer shrink-0';
            delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            delBtn.addEventListener('click', (e) => deleteCustomLink(e, index));
            left.appendChild(a);
            wrap.append(left, delBtn);
            return wrap;
        }

        function toggleExpandCustomLinks() { isCustomLinksExpanded = !isCustomLinksExpanded; loadCustomLinks(); }
        async function deleteCustomLink(e, index) {
            e.preventDefault(); e.stopPropagation(); if(!confirm(t('delConfirm'))) return;
            let links = [];
            try { const res = await fetch('/api/links'); if(res.ok) { const data = await res.json(); links = (data && Array.isArray(data.data)) ? data.data : []; } } catch (err) {}
            if (!links.length) { try { links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); } catch (err) {} }
            links.splice(index, 1);
            try {
                const res = await fetch('/api/links', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-key': getAdminKey() }, body: JSON.stringify(links) });
                if (!res.ok) throw new Error('unauthorized');
                localStorage.setItem('nav_custom_links', JSON.stringify(links));
                if(links.length <= 9) isCustomLinksExpanded = false;
                loadCustomLinks();
            } catch(error) {
                localStorage.setItem('nav_custom_links', JSON.stringify(links));
                if(links.length <= 9) isCustomLinksExpanded = false;
                loadCustomLinks();
                alert(t('needLogin'));
            }
        }

        function loadFriendLinks() {
            const container = document.getElementById('friend-links-container');
            let links = [];
            try { links = JSON.parse(localStorage.getItem('nav_friend_links') || '[]'); } catch (e) {}
            container.innerHTML = '';
            if(links.length === 0) {
                links = [
                    { name: "V-Boost项目简介", url: "https://weixin.qq.com/sph/AQf4RuKlsN" },
                    { name: "V-Boost新人第一课", url: "https://mp.weixin.qq.com/s/3OvEYhBM0VcUKaThHgr-Vw" }
                ];
            }
            links.forEach((item, index) => {
                const displayName = getLocalizedLinkName(item.name, item.url);
                const wrap = document.createElement('div');
                wrap.className = 'group relative flex items-center justify-between p-2.5 bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-emerald-600/10 transition-all text-center';
                const a = document.createElement('a');
                a.href = item.url;
                a.draggable = false;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'w-full text-xs font-medium text-slate-400 hover:text-emerald-400 transition-colors truncate px-2';
                a.textContent = displayName;
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'admin-only absolute right-1 text-[10px] text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-500/10 px-1 rounded cursor-pointer';
                delBtn.innerHTML = '<i class="fas fa-times"></i>';
                delBtn.addEventListener('click', (e) => deleteFriendLink(e, index));
                wrap.append(a, delBtn);
                container.appendChild(wrap);
            });
        }
        function deleteFriendLink(e, index) {
            e.preventDefault(); e.stopPropagation();
            let links = [];
            try { links = JSON.parse(localStorage.getItem('nav_friend_links') || '[]'); } catch (err) {}
            if(links.length === 0) { links = [ { name: "V-Boost项目简介", url: "https://weixin.qq.com/sph/AQf4RuKlsN" }, { name: "V-Boost新人第一课", url: "https://mp.weixin.qq.com/s/3OvEYhBM0VcUKaThHgr-Vw" } ]; }
            links.splice(index, 1);
            localStorage.setItem('nav_friend_links', JSON.stringify(links));
            loadFriendLinks();
        }

        // --- 初始化运转 ---
        document.addEventListener('click', () => { document.getElementById('engine-menu').classList.add('hidden'); document.getElementById('theme-panel').classList.add('hidden'); });
        checkAdminSession(); document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en'; applyLanguage(); updateClockAndGreeting(); fetchWeather(); initCloudData();
    </script>
